        const VirtualGrid = ({ items, renderItem }) => {
            const containerRef = useRef(null);
            const [scrollTop, setScrollTop] = useState(0);
            const [dimensions, setDimensions] = useState({ width: window.innerWidth, height: window.innerHeight });

            useEffect(() => {
                // 尋找最近的有 overflow-y-auto 的容器，若無則綁定 window
                const scrollContainer = containerRef.current?.closest('.overflow-y-auto') || window;

                let animationFrameId;
                const handleScroll = () => {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(() => {
                        if (scrollContainer === window) {
                            setScrollTop(window.scrollY);
                        } else {
                            setScrollTop(scrollContainer.scrollTop);
                        }
                    });
                };
                const handleResize = () => {
                    if (scrollContainer === window) {
                        setDimensions({ width: window.innerWidth, height: window.innerHeight });
                    } else {
                        setDimensions({ width: scrollContainer.clientWidth, height: scrollContainer.clientHeight });
                    }
                };

                scrollContainer.addEventListener('scroll', handleScroll, { passive: true });
                window.addEventListener('resize', handleResize);
                handleScroll(); // Initial call
                handleResize();

                return () => {
                    scrollContainer.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('resize', handleResize);
                    cancelAnimationFrame(animationFrameId);
                }
            }, []);

            // Grid column count based on Tailwind breakpoints
            const cols = dimensions.width < 768 ? 2 : (dimensions.width < 1024 ? 3 : 4);
            // Estimate row height based on responsive card design
            const estimatedRowHeight = dimensions.width < 768 ? 320 : 380; 

            const totalRows = Math.ceil(items.length / cols);

            let relativeScrollY = scrollTop;
            if (containerRef.current) {
                const scrollContainer = containerRef.current.closest('.overflow-y-auto');
                if (scrollContainer) {
                    // 計算 Grid 距離滾動容器頂部的相對位置
                    const containerTop = scrollContainer.getBoundingClientRect().top;
                    const gridTop = containerRef.current.getBoundingClientRect().top;
                    const offsetFromScrollContainer = gridTop - containerTop + scrollContainer.scrollTop;
                    relativeScrollY = Math.max(0, scrollTop - offsetFromScrollContainer);
                } else {
                    const containerOffset = containerRef.current.getBoundingClientRect().top + window.scrollY;
                    relativeScrollY = Math.max(0, scrollTop - containerOffset);
                }
            }

            const overscanRows = 4; // 緩衝列數，確保滑動平滑

            const startRow = Math.max(0, Math.floor(relativeScrollY / estimatedRowHeight) - overscanRows);
            const visibleRows = Math.ceil(dimensions.height / estimatedRowHeight) + (overscanRows * 2);
            const endRow = Math.min(totalRows, startRow + visibleRows);

            const startIndex = startRow * cols;
            const endIndex = endRow * cols;
            const visibleItems = items.slice(startIndex, endIndex);

            // 用 Padding 撐開上下方尚未/已滑過不需渲染的空間
            const paddingTop = startRow * estimatedRowHeight;
            const paddingBottom = Math.max(0, (totalRows - endRow) * estimatedRowHeight);

            return (
                <div ref={containerRef} style={{ paddingTop: `${paddingTop}px`, paddingBottom: `${paddingBottom}px` }}>
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                        {visibleItems.map(item => renderItem(item))}
                    </div>
                </div>
            );
        };

            // 新增自建 Modal 狀態與預設表單

                if (match) {

                    const month = match[2] ? parseInt(match[2]) : 0; 
                    return year * 100 + month;
                }
                return 0;

            // 新增：提取 ID 作為時間戳記，確保自建(巨大數字)排在官方流水號之前
            const getAddedTimestamp = (id) => {
                if (id.startsWith('custom-')) {
                    return parseInt(id.replace('custom-', ''), 10);
                }
                if (id.startsWith('plush-')) {

            const processedData = allPlushData

                    const matchUncollected = uncollectedOnly ? !collection.includes(item.id) : true;
                    const matchCustomOnly = customOnly ? item.id.startsWith('custom-') : true;
                    return matchSearch && matchCategory && matchUncollected && matchCustomOnly;
                })
                .sort((a, b) => {
                    const dateA = getSortableDate(a.releaseDate);
                    const dateB = getSortableDate(b.releaseDate);

                    // 取出純數字的時間戳記/流水號
                    const timeA = getAddedTimestamp(a.id);
                    const timeB = getAddedTimestamp(b.id);

                    if (sortBy === 'tier') {
                        const tierWeight = { 'Max': 4, 'High': 3, 'Medium': 2, 'low': 1 };
                        const diff = (tierWeight[b.tier] || 0) - (tierWeight[a.tier] || 0);

                        return timeB - timeA;
                    } else if (sortBy === 'releaseDate') {
                        if (dateA !== dateB) return dateB - dateA;
                        return timeB - timeA;
                    } else { // sortBy === 'newest'
                        return timeB - timeA; // 最新的自建數字最大，會排最前面
                    }

            const ownedItems = collection.slice().reverse().map(id => allPlushData.find(item => item.id === id)).filter(Boolean);
            const wishlistItems = wishlist.slice().reverse().map(id => allPlushData.find(item => item.id === id)).filter(Boolean);

                    <button

                        className={`fixed bottom-6 right-6 md:bottom-8 md:right-8 z-50 flex flex-col items-center justify-center w-12 h-12 bg-gradient-to-br from-sky-400 to-blue-500 text-white rounded-full shadow-[0_4px_14px_rgba(14,165,233,0.4)] hover:shadow-[0_6px_20px_rgba(14,165,233,0.6)] transition-all duration-300 ${showTopBtn ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}
                    >
                        <Icon name="arrow-up" size={20} />
                        <span className="text-[10px] font-black leading-none mt-0.5">TOP</span>
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
