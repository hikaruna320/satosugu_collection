                                            { label: '夏油傑商品', value: plushData.filter(d => d.suguruGeto).length, color: 'text-indigo-500' }
                                        ].map((stat, i) => (
                                            <div key={i} className="glass-panel p-5 rounded-2xl flex flex-col justify-center items-center text-center">
                                                <span className={`text-3xl font-black ${stat.color}`}>{stat.value}</span>
                                                <span className="text-xs font-bold text-slate-500 mt-1">{stat.label}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-8">
                                        <h3 className="text-lg font-bold text-slate-700 mb-4">💎 我的焦點</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {plushData.filter(d => d.tier === 'S').slice(0,2).map(item => (
                                                <div key={item.id} className="glass-panel p-4 rounded-2xl flex gap-4 cursor-pointer hover:bg-white/60 transition" onClick={() => setSelectedItem(item)}>
                                                    <img src={item.img} alt={item.nameTW} className="w-24 h-24 object-cover rounded-xl shadow-sm" />
                                                    <div className="flex-1 flex flex-col justify-center">
                                                        <TierBadge tier={item.tier} />
                                                        <h4 className="font-bold text-slate-800 mt-2 line-clamp-1">{item.nameTW}</h4>
                                                        <p className="text-xs font-medium text-slate-500 mt-1">{item.brand}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentTab === 'gallery' && (
                                <div className="space-y-6 animate-in fade-in duration-500">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 glass-panel p-4 rounded-2xl">
                                        <div className="relative w-full md:w-72">
                                            <Icon name="search" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-sky-500" />
                                            <input 
                                                type="text" 
                                                placeholder="搜尋名稱、品牌或系列..." 
                                                className="w-full pl-10 pr-4 py-2.5 bg-white/70 backdrop-blur-sm border border-white/80 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white text-slate-700 placeholder-slate-400 transition-all"
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                            />
                                        </div>
                                        <div className="flex gap-2 w-full md:w-auto overflow-x-auto hide-scrollbar pb-1 md:pb-0">
                                            {['All', 'S', 'A', 'B', 'C'].map(tier => (
                                                <button 
                                                    key={tier}
                                                    onClick={() => setFilterTier(tier)}
                                                    className={`px-4 py-2 rounded-xl text-sm font-bold flex-shrink-0 transition-all ${filterTier === tier ? 'bg-sky-500 text-white shadow-md shadow-sky-500/30' : 'glass-card text-slate-600 hover:text-sky-600'}`}>
                                                    {tier === 'All' ? '五夏濃度' : `${tier} 級`}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                                        {filteredData.map(item => (
                                            <div key={item.id} className="glass-card rounded-2xl overflow-hidden cursor-pointer group flex flex-col" onClick={() => setSelectedItem(item)}>
                                                <div className="relative aspect-square overflow-hidden bg-white/50">
                                                    <img src={item.img} alt={item.nameTW} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                                    <div className="absolute top-2 left-2"><TierBadge tier={item.tier} /></div>
                                                    
                                                    {/* 收藏狀態標記 */}
                                                    <div className="absolute top-2 right-2 flex gap-1">
                                                        {collection.includes(item.id) && (
                                                            <div className="bg-sky-500 p-1.5 rounded-full shadow-md text-white">
                                                                <Icon name="shield-check" size={14} />
                                                            </div>
                                                        )}
                                                        {wishlist.includes(item.id) && (
                                                            <div className="bg-pink-500 p-1.5 rounded-full shadow-md text-white">
                                                                <Icon name="heart" size={14} fill="currentColor" />
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                                <div className="p-4 flex-1 flex flex-col">
                                                    <p className="text-[10px] font-bold text-sky-600 mb-1 uppercase tracking-wider">{item.brand}</p>
                                                    <h3 className="font-bold text-slate-800 text-sm leading-snug line-clamp-2 mb-2">{item.nameTW}</h3>
                                                    <div className="mt-auto flex items-center justify-between pt-3 border-t border-slate-200/50">
                                                        <Stars count={item.rarity} />
                                                        <span className="text-xs font-semibold text-slate-500">{item.type}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    {filteredData.length === 0 && (
                                        <div className="text-center py-20 text-slate-500 font-medium glass-panel rounded-2xl">
                                            找不到符合條件的娃娃 🥲
                                        </div>
                                    )}
                                </div>
                            )}

                            {currentTab === 'collection' && (
                                <div className="space-y-8 animate-in fade-in duration-500">
                                    <div className="glass-panel rounded-2xl p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6">
                                        <div>
                                            <h2 className="text-2xl font-black text-slate-800">我的收藏</h2>
                                            <p className="text-sm font-medium text-slate-500 mt-2">
                                                目前已收集 {collection.length} 款 / 願望清單 {wishlist.length} 款
                                            </p>
                                        </div>
                                        <div className="w-full md:w-64 glass-card p-4 rounded-xl">
                                            <div className="flex justify-between text-sm font-bold mb-2">
                                                <span className="text-slate-600">圖鑑完成度</span>
                                                <span className="text-sky-600">{Math.round((collection.length / plushData.length) * 100)}%</span>
                                            </div>
                                            <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                                <div className="bg-sky-500 h-full rounded-full transition-all duration-1000" style={{ width: `${(collection.length / plushData.length) * 100}%` }}></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                                            <Icon name="shield-check" size={20} className="text-sky-500" /> 已擁有的神物
                                        </h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            {plushData.filter(item => collection.includes(item.id)).length > 0 ? 
                                                plushData.filter(item => collection.includes(item.id)).map(item => (
                                                    <div key={item.id} className="glass-card rounded-2xl overflow-hidden cursor-pointer flex flex-col" onClick={() => setSelectedItem(item)}>
                                                        <div className="relative aspect-square bg-white/50">
                                                            <img src={item.img} alt={item.nameTW} className="w-full h-full object-cover" />
                                                            <div className="absolute top-2 left-2"><TierBadge tier={item.tier} /></div>
                                                        </div>
                                                        <div className="p-3 text-sm font-bold text-slate-800 line-clamp-1">{item.nameTW}</div>
                                                    </div>
                                                )) : 
                                                <div className="col-span-full py-8 text-center text-slate-400 font-medium">尚未添加任何收藏。去圖鑑列表逛逛吧！</div>
                                            }
                                        </div>
                                    </div>
                                    
                                    <div className="pt-4 border-t border-slate-200/50">
                                        <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                                            <Icon name="heart" size={20} className="text-pink-500" /> 願望清單
                                        </h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 opacity-80">
                                            {plushData.filter(item => wishlist.includes(item.id)).length > 0 ? 
                                                plushData.filter(item => wishlist.includes(item.id)).map(item => (
                                                    <div key={item.id} className="glass-card rounded-2xl overflow-hidden cursor-pointer flex flex-col" onClick={() => setSelectedItem(item)}>
                                                        <div className="relative aspect-square bg-white/50 grayscale hover:grayscale-0 transition-all duration-300">
                                                            <img src={item.img} alt={item.nameTW} className="w-full h-full object-cover" />
                                                        </div>
                                                        <div className="p-3 text-sm font-bold text-slate-800 line-clamp-1">{item.nameTW}</div>
                                                    </div>
                                                )) : 
                                                <div className="col-span-full py-8 text-center text-slate-400 font-medium">願望清單空空如也！</div>
                                            }
                                        </div>
                                    </div>
                                </div>
                            )}
                            {/* 免責聲明 Footer */}
                            <footer className="mt-12 pt-6 border-t border-white/60 text-center pb-4">
                                <p className="text-[11px] md:text-xs text-slate-500 leading-relaxed max-w-4xl mx-auto font-medium">
                                    <strong>【免責聲明】</strong><br/>
                                    本網站為粉絲基於熱愛建立的非營利資料庫，與《呪術廻戦》官方、集英社、東寶及相關製造商無任何從屬關係。<br/>
                                    網站內所使用的角色圖像、商品照片與版權名稱，其著作權與商標權均歸原權利人所有。本站僅作資料彙整與學術/收藏交流之用，絕無任何商業營利目的。
                                </p>
                            </footer>
                        </main>
                    </div>

                    {/* 商品詳情 Modal 視窗 */}
                    {selectedItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-6 animate-in fade-in duration-200">
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onClick={() => setSelectedItem(null)}></div>
                            <div className="relative w-full max-w-4xl max-h-[90vh] glass-panel rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row bg-white/90">
                                
                                <button 
                                    onClick={() => setSelectedItem(null)}
                                    className="absolute top-4 right-4 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-white/50 hover:bg-white text-slate-600 transition-colors backdrop-blur-md border border-slate-200">
                                    <Icon name="x" size={18} />
                                </button>

                                <div className="w-full md:w-2/5 relative bg-white/40 p-6 flex flex-col items-center justify-center border-r border-slate-200/60">
                                    <img src={selectedItem.img} alt={selectedItem.nameTW} className="w-full max-w-[280px] aspect-square object-cover rounded-2xl shadow-md mix-blend-multiply" />
                                    <div className="absolute top-6 left-6 flex gap-2">
                                        <TierBadge tier={selectedItem.tier} />
                                    </div>
                                    
                                    {/* Modal Actions */}
                                    <div className="flex w-full gap-3 mt-8">
                                        <button 
                                            onClick={() => toggleCollection(selectedItem.id)}
                                            className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-sm transition-all ${collection.includes(selectedItem.id) ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/40' : 'bg-white/60 text-slate-700 hover:bg-sky-50 hover:text-sky-600 border border-slate-200'}`}>
                                            <Icon name="shield-check" size={18} /> {collection.includes(selectedItem.id) ? '已入庫' : '標記收藏'}
                                        </button>
                                        <button 
                                            onClick={() => toggleWishlist(selectedItem.id)}
                                            className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-sm transition-all ${wishlist.includes(selectedItem.id) ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/40' : 'bg-white/60 text-slate-700 hover:bg-pink-50 hover:text-pink-600 border border-slate-200'}`}>
                                            <Icon name="heart" size={18} fill={wishlist.includes(selectedItem.id) ? "currentColor" : "none"} /> 想收
                                        </button>
                                    </div>
                                </div>

                                <div className="flex-1 p-6 md:p-8 overflow-y-auto hide-scrollbar">
                                    <div className="mb-6">
                                        <p className="text-xs font-bold text-sky-600 mb-2">{selectedItem.brand} · {selectedItem.type}</p>
                                        <h2 className="text-2xl font-black text-slate-800 leading-tight">{selectedItem.nameTW}</h2>
                                        <p className="text-sm font-medium text-slate-500 mt-1">{selectedItem.nameJP}</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 mb-8">
                                        <div className="glass-card p-4 rounded-2xl">
                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">日本二手行情</p>
                                            <p className="text-lg font-black text-slate-800">{selectedItem.marketPrice}</p>
                                        </div>
                                        <div className="glass-card p-4 rounded-2xl">
                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">發售資訊</p>
                                            <p className="text-sm font-bold text-slate-800">{selectedItem.releaseDate} / {selectedItem.price}</p>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div>
                                            <h3 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2 border-b border-slate-200/60 pb-2">
                                                <Icon name="tag" size={16} className="text-sky-500" /> 五夏關係與評價
                                            </h3>
                                            <div className="grid grid-cols-2 gap-y-3 gap-x-4 text-sm">
                                                <div className="text-slate-500">所屬企劃</div>
                                                <div className="font-bold text-slate-800">{selectedItem.series}</div>
                                                <div className="text-slate-500">客觀稀有度</div>
                                                <div className="flex items-center gap-2"><Stars count={selectedItem.rarity} /></div>
                                                <div className="col-span-2 mt-2 p-3 bg-blue-50/50 rounded-xl text-sm leading-relaxed text-slate-700 border border-blue-100/50">
                                                    <span className="font-bold text-blue-800 mr-2">短評:</span>{selectedItem.comment}
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2 border-b border-slate-200/60 pb-2">
                                                <Icon name="shield-check" size={16} className="text-emerald-500" /> 正版辨識指南
                                            </h3>
                                            <ul className="space-y-2 text-sm text-slate-700">
                                                {selectedItem.authCheck.map((check, i) => (
                                                    <li key={i} className="flex items-start gap-2">
                                                        <span className="text-emerald-500 font-bold mt-0.5">✓</span> {check}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
